<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wire Report</title>
<meta name="description" content="The Wire Report — an independent newspaper front page with a press room for filing your own dispatches.">
</head>
<body>
<style id="page-style">
  @import url('https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@500;600;700;800&display=swap');

  /* Committed light-only editorial palette: this masthead reads on white, always. */
  :root{
    --paper:#FFFFFF;
    --paper-raised:#F5F3EC;
    --navy:#12202E;
    --ink:#15130F;
    --ink-soft:#5C574C;
    --accent:#8B1A2B;
    --gold:#A9812E;
    --hair:rgba(21,19,15,.24);
    --hair-soft:rgba(21,19,15,.12);
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'PT Serif', Georgia, serif;
    padding-inline:20px;
    max-width:1180px;
    margin:0 auto;
  }
  #app{
    border-inline:1px solid var(--hair-soft);
    padding-inline:26px;
  }
  @media (max-width:760px){ #app{ border-inline:none; padding-inline:0; } }
  a{color:inherit;}
  h1,h2,h3{text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--accent); color:var(--paper);}

  .eyebrow{
    font-family:'Libre Franklin', sans-serif;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:.72rem;
  }

  /* ---------- masthead ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:.4em;
    padding-block:12px 6px;
    font-family:'Libre Franklin', sans-serif;
    font-size:.72rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .rule{border:none; border-top:1px solid var(--hair); margin:0;}
  .rule-thick{border-top-width:3px; border-color:var(--ink);}
  .rule-thin{border-top-width:1px;}

  .nameplate-wrap{ text-align:center; padding-block:26px 14px; }
  .nameplate{
    display:inline-flex;
    align-items:baseline;
    font-size:clamp(2.6rem, 8.6vw, 4.8rem);
    line-height:1;
    letter-spacing:-.01em;
  }
  .nameplate .n-the, .nameplate .n-report{
    font-family:'Helvetica Neue', Helvetica, Arial, 'Arimo', sans-serif;
    font-weight:500;
    font-style:normal;
  }
  .nameplate .n-wire{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:500;
    font-style:italic;
    margin:0 .07em;
  }
  .nameplate-img{
    display:block;
    height:clamp(3.4rem, 11vw, 6.6rem);
    width:auto;
    max-width:100%;
  }
  .tagline{
    font-family:'Libre Franklin', sans-serif;
    font-weight:600;
    font-size:.72rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:14px;
  }

  nav.sections{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:4px 26px;
    padding:14px 10px;
    background:var(--navy);
    font-family:'Libre Franklin', sans-serif;
    font-weight:600;
    font-size:.78rem;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  nav.sections button{
    background:none; border:none; cursor:pointer;
    color:rgba(255,255,255,.72); padding:4px 2px;
    border-bottom:2px solid transparent;
  }
  nav.sections button:hover, nav.sections button:focus-visible{ color:#fff; }
  nav.sections button.active{ color:#fff; border-color:var(--gold); }
  nav.sections button.submit-btn{
    color:var(--navy); background:var(--gold);
    padding:6px 16px; border-radius:1px; border-bottom:none;
    font-weight:700;
  }
  nav.sections button.submit-btn:hover{ background:#fff; }

  /* ---------- front page layout ---------- */
  .front-grid{
    display:grid;
    grid-template-columns:1.7fr 1fr;
    gap:34px;
    padding-block:28px 10px;
  }
  .lead-tag{ color:var(--accent); }
  .lead h2{
    font-family:'Arimo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:500;
    letter-spacing:-.01em;
    font-size:clamp(1.7rem, 3.4vw, 2.5rem);
    margin-top:.3em;
  }
  .lead .dek{
    font-style:italic;
    color:var(--ink-soft);
    font-size:1.08rem;
    margin-top:.5em;
  }
  .meta{
    font-family:'Libre Franklin', sans-serif;
    font-size:.72rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:.6em;
  }
  .lead p.excerpt{ margin-top:1em; font-size:1.02rem; }
  .lead p.excerpt::first-letter{
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:3.4em;
    float:left;
    line-height:.82;
    padding:.03em .07em 0 0;
    color:var(--accent);
  }
  .continue{
    display:inline-block; margin-top:1em;
    font-family:'Libre Franklin', sans-serif;
    font-weight:700; font-size:.82rem; letter-spacing:.04em;
    text-transform:uppercase; color:var(--accent);
    background:none; border:none; cursor:pointer; padding:0;
  }
  .continue:hover{ color:var(--gold); }

  .rail{ border-left:1px solid var(--hair); padding-left:26px; }
  .rail h3.rail-title{
    font-family:'Libre Franklin', sans-serif;
    font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--accent); margin-bottom:14px; font-weight:700;
    border-bottom:1px solid var(--hair); padding-bottom:10px;
  }
  .rail-item{ display:flex; gap:14px; padding-block:14px; border-top:1px solid var(--hair-soft); cursor:pointer;}
  .rail-item:first-child{ border-top:none; }
  .rail-num{
    font-family:'Playfair Display', serif; font-weight:800; font-size:1.5rem;
    color:var(--hair); line-height:1; flex-shrink:0; width:1.1em;
  }
  .rail-item h4{
    font-family:'Arimo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:500; letter-spacing:-.005em; font-size:1.02rem;
  }
  .rail-item:hover h4{ color:var(--accent); }
  .rail-item .meta{ margin-top:.4em; }

  .story-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:0;
    margin-top:14px;
    border-top:3px solid var(--ink);
  }
  .story-card{
    padding:20px 22px;
    border-right:1px solid var(--hair);
    cursor:pointer;
  }
  .story-card:last-child, .story-card:nth-child(3n){ border-right:none; }
  .story-card h4{
    font-family:'Arimo', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight:500; letter-spacing:-.005em; font-size:1.14rem;
    margin-top:.4em;
  }
  .story-card:hover h4{ color:var(--accent); }
  .story-card .dek{ color:var(--ink-soft); font-size:.92rem; margin-top:.5em; }

  .art{
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--paper-raised);
    border:1px solid var(--gold);
    color:var(--ink);
    flex-shrink:0;
  }
  .art svg{ display:block; }
  .art-lead{ width:220px; height:220px; padding:20px; margin-bottom:16px; }
  .art-card{ width:56px; height:56px; padding:11px; margin-bottom:10px; }
  .art-rail{ width:44px; height:44px; padding:9px; }
  .art-article{ width:120px; height:120px; padding:22px; margin:.6em 0 1.2em; }
  .art.art-photo{ padding:0; overflow:hidden; border-color:var(--hair); border-radius:3px; }
  .art.art-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .article-photo-wrap{ margin:1.1em 0 1.5em; }
  .article-photo{
    width:100%; max-width:640px; display:block;
    border:1px solid var(--hair); border-radius:2px;
  }
  .article-photo-cap{
    font-family:'Libre Franklin', sans-serif; font-style:italic;
    font-size:.78rem; color:var(--ink-soft); margin-top:.6em; max-width:640px;
  }

  .empty-note{
    padding:40px 10px; text-align:center; color:var(--ink-soft);
    font-family:'Libre Franklin', sans-serif; font-size:.92rem;
  }

  /* ---------- article page ---------- */
  .article-page{ padding-block:30px 10px; max-width:720px; margin:0 auto; }
  .back-link{
    font-family:'Libre Franklin', sans-serif; font-weight:600; font-size:.78rem;
    letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; padding:0; margin-bottom:18px;
  }
  .back-link:hover{ color:var(--accent); }
  .article-page h1.headline{
    font-family:'Arimo', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight:500;
    letter-spacing:-.01em;
    font-size:clamp(1.9rem, 4.4vw, 2.9rem);
    margin-top:.2em;
  }
  .article-page .dek{ font-style:italic; color:var(--ink-soft); font-size:1.15rem; margin-top:.5em; }
  .article-page .byline-row{ margin-top:1em; padding-block:.8em; border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); }
  .article-body{ margin-top:1.6em; font-size:1.08rem; }
  .article-body p{ margin:0 0 1.1em; }
  .article-body p:first-of-type::first-letter{
    font-family:'Playfair Display', serif; font-weight:800;
    font-size:3.6em; float:left; line-height:.8;
    padding:.04em .08em 0 0; color:var(--accent);
  }
  .source-note{
    margin-top:2em; padding-top:1em; border-top:1px solid var(--hair-soft);
    font-family:'Libre Franklin', sans-serif; font-size:.78rem; color:var(--ink-soft);
    font-style:italic;
  }
  .related{ margin-top:2.4em; }
  .related h3{
    font-family:'Libre Franklin', sans-serif; font-size:.76rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft); border-top:3px solid var(--ink); padding-top:10px;
  }
  .related-item{ padding-block:10px; border-top:1px solid var(--hair-soft); cursor:pointer; }
  .related-item:hover h4{ color:var(--accent); }
  .related-item h4{ font-family:'Arimo', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight:500; letter-spacing:-.005em; font-size:1rem; }

  .notice-banner{
    background:var(--paper-raised); border:1px solid var(--hair);
    border-left:4px solid var(--accent);
    padding:12px 16px; margin:20px 0 0;
    font-family:'Libre Franklin', sans-serif; font-size:.86rem;
    max-width:720px; margin-inline:auto;
  }

  /* ---------- submit page ---------- */
  .submit-page{ padding-block:30px 20px; max-width:640px; margin:0 auto; }
  .submit-page h2{
    font-family:'Playfair Display', serif; font-weight:800; font-size:1.9rem;
  }
  .submit-page .dek{ color:var(--ink-soft); font-style:italic; margin-top:.4em; }
  .field{ margin-top:1.4em; display:flex; flex-direction:column; gap:.4em; }
  .field label{
    font-family:'Libre Franklin', sans-serif; font-weight:700; font-size:.76rem;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field input, .field select, .field textarea{
    font-family:'PT Serif', Georgia, serif;
    font-size:1rem;
    background:var(--paper-raised);
    color:var(--ink);
    border:1px solid var(--hair);
    padding:.6em .7em;
    border-radius:2px;
  }
  .field textarea{ min-height:220px; resize:vertical; line-height:1.5; }
  .field small{ color:var(--ink-soft); font-family:'Libre Franklin', sans-serif; font-size:.74rem; }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .file-btn{
    margin-top:1.8em;
    background:var(--accent); color:var(--paper);
    border:none; padding:.8em 1.6em; border-radius:2px;
    font-family:'Libre Franklin', sans-serif; font-weight:700; font-size:.86rem;
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
  }
  .file-btn:hover{ background:var(--gold); }
  .file-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .save-state{
    margin-top:.9em; font-family:'Libre Franklin', sans-serif; font-size:.78rem; color:var(--ink-soft);
  }

  footer.colophon{
    margin-top:40px; padding-block:22px 34px;
    border-top:3px solid var(--ink);
    text-align:center;
    font-family:'Libre Franklin', sans-serif;
    font-size:.74rem; letter-spacing:.06em;
    color:var(--ink-soft);
  }

  @media (max-width:760px){
    .front-grid{ grid-template-columns:1fr; }
    .rail{ border-left:none; border-top:1px solid var(--hair); padding-left:0; padding-top:20px; }
    .story-grid{ grid-template-columns:1fr; }
    .story-card{ border-right:none !important; border-bottom:1px solid var(--hair); }
  }
</style>

<div id="app">
  <header>
    <div id="masthead-mount"></div>
  </header>
  <main id="content-mount"></main>
  <footer id="footer-mount"></footer>
</div>

    "headline": "His Cat Walked Across His Keyboard and Bought $124,000 of Gold. Hours Later, He Was $6,400 Richer.",
    "dek": "A San Diego engineer stepped away from his desk for coffee. He came back to find his cat had opened a six-figure position in gold — and made him thousands of dollars.",
    "byline": "Staff Correspondent",
    "date": "September 18, 2026",
    "body": "SAN DIEGO — Ryan Mitchell didn't think much of it when his cat walked across his desk Tuesday morning. The 31-year-old software engineer had stepped away from his computer to make coffee, leaving his brokerage account open on his second monitor, which was displaying a chart for SPDR Gold Shares (GLD) that he had been watching for several days. When he came back, his cat, Milo, was sitting directly on the keyboard. \"I moved him off and didn't really think about it,\" Mitchell said.\n\nIt wasn't until several hours later that he noticed something strange in his account: a new position, 300 shares of GLD, worth roughly $124,000. \"I thought I had somehow clicked something by accident,\" Mitchell said. \"Then I saw the order time.\" The trade had gone through at 9:18 a.m. — a time when Mitchell wasn't at his computer. His cat was.\n\nMitchell had been watching gold because of unusually large moves in the market this month, as traders reacted to shifting interest-rate expectations, Treasury yields, the dollar and oil prices. He hadn't planned to trade Tuesday morning; he had simply left the GLD order window open while comparing the metal's recent price action to the broader market. Working backward through the order history, he pieced together what had likely happened: Milo had walked across the keyboard, brought the order window into focus, and apparently struck a key combination that changed the quantity field moments before the order submitted itself. \"I still don't know exactly how he managed to do it,\" Mitchell said. \"I tried reproducing it afterward and couldn't.\"\n\nThere was no algorithm, no strategy — just a cat, an unlocked computer and a brokerage account. Mitchell considered selling the position immediately, but gold had begun moving higher. The trade, briefly underwater, turned positive by the afternoon, putting him up roughly $1,500. By Wednesday, as gold continued trading near record levels — Reuters reported futures settling around $4,424.90 an ounce on September 18 — the position had gained several thousand dollars more. Mitchell eventually closed it out for a profit of $6,417.83. \"I didn't make that trade,\" he said. \"My cat made that trade.\"\n\nMitchell sent a screenshot of the closed position to a group chat with friends, who assumed at first that he'd made the trade on purpose. When he explained what had happened, one friend asked for a picture of the cat responsible. \"I've spent years reading about markets and trying to understand what moves gold,\" Mitchell said. \"Apparently all I needed to do was get a cat.\" He isn't handing over his portfolio to Milo, though: he has since enabled an extra confirmation step for trades and makes a point of locking his computer whenever he steps away. The profit is going into savings, and despite the jokes from his friends, Mitchell says there won't be a second trade. \"One lucky trade is enough.\"",
    "source": "Original reporting for The Wire Report, San Diego."
  },

    "headline": "Federal Reserve Raises Rates to 4%, Ending a Three-Year Pause",
    "dek": "The first rate hike since 2023 comes as inflation holds above target and oil prices climb on tensions in the Middle East — a decision the White House swiftly condemned.",
    "byline": "Wire Business Desk",
    "date": "September 16, 2026",
    "body": "The Federal Reserve raised its benchmark interest rate by a quarter point on Wednesday, lifting the target range to 3.75-4 percent in its first increase since 2023. The vote was unanimous.\n\nPolicymakers pointed to a resilient economy — strong productivity, steady investment and continued consumer spending — even as inflation remains stuck above the Fed's 2 percent target. Annual inflation is running near 3.4 percent, a figure the committee said the rate increase was designed to bring down more quickly. Rising oil prices, driven by escalating tensions involving Iran, have added further upward pressure on prices at the pump, with Brent crude near $107 a barrel and the national gasoline average at $4.36 a gallon.\n\nThe decision drew immediate criticism from the White House. President Trump, who appointed Fed Chair Kevin Warsh, called on social media for rates of \"1 percent or less\" and demanded they be brought down \"fast\" — a rare public clash between the administration and a Fed chair it selected.\n\nMarkets had largely priced in the move, but investors will be watching closely for signals on whether Wednesday's hike marks the start of a longer tightening cycle or a single, targeted response to energy-driven inflation.",

    "headline": "Meta Bets Billions on Its Own AI Chips to Break Free of Nvidia",
    "dek": "Analysts say Meta's in-house MTIA silicon, co-developed with Broadcom, could save the company as much as $8.5 billion next year alone.",
    "byline": "Wire Technology Desk",
    "date": "September 17, 2026",
    "body": "Meta is preparing to move a growing share of its AI computing onto chips it designed itself, a shift analysts say could save the company roughly $8.5 billion in 2027 by reducing its reliance on third-party graphics processors.\n\nThe company plans to bring two new generations of its custom MTIA chip online by the end of 2027: a chip code-named Arke arriving in the first half of the year, followed by a second, Astrid, later on. Both are being co-developed with Broadcom and built specifically to handle AI inference — the process of running a trained model rather than training it from scratch.\n\nBank of America's estimate assumes Meta deploys five to six gigawatts of owned computing capacity next year, with custom silicon delivering roughly 40 percent in cost savings over comparable commercial GPUs. Meta has already raised its 2026 capital spending guidance to between $130 billion and $145 billion, with quarterly infrastructure spending up 82 percent from a year earlier.\n\nBroadcom's chief executive said the custom chips \"outperform any GPU\" on the workloads Meta cares about most, and do it \"at half the cost\" — a claim that, if it holds, would mark a meaningful shift in leverage away from merchant chip suppliers and toward the handful of companies now designing silicon for their own data centers.",
    "source": "Compiled from Bloomberg, Benzinga and 24/7 Wall St. reporting on Bank of America's analysis, September 2026."

    "headline": "Zverev Outlasts Shelton in Four Sets to Win Second Major of the Year",
    "dek": "Alexander Zverev beat American Ben Shelton in the US Open final, becoming just the fourth man in the Open Era to win his first two Grand Slam titles in the same season.",
    "byline": "Wire Sports Desk",
    "date": "September 13, 2026",
    "body": "Alexander Zverev defeated Ben Shelton 6-3, 7-6(2), 5-7, 6-2 on Sunday to win the US Open men's singles title, capping a breakthrough season that began with his first Grand Slam win at Roland Garros in the spring.\n\nZverev dominated the first two sets at Arthur Ashe Stadium, absorbing Shelton's heavy serve and redirecting pace with precision. Shelton, playing in his first Grand Slam final, rallied to take the third set 7-5 after a loose service game from Zverev, briefly energizing the home crowd. Zverev regained control immediately in the fourth, breaking in the opening game and closing out the match by winning 12 of the final 14 points.\n\n\"I think God has seen how hard we worked, how much we suffered, how much pain we went through,\" Zverev said afterward. He had warm words for his opponent as well: \"Ben, you're an incredible player, an incredible person. This was your first Grand Slam final, but I already told you that you're going to be back here many, many more times.\"\n\nThe win makes Zverev the fourth man in the Open Era to capture his first two major titles in the same season, and cements 2026 as the year he finally broke through at the sport's biggest stages after years as one of tennis's most consistent near-misses.",
    "source": "Compiled from ATP Tour and ESPN coverage of the 2026 US Open final."

    "headline": "Looking Back at Artemis II, NASA Sets Its Sights on Landing",
    "dek": "Four astronauts flew nearly 700,000 miles around the Moon and back this year in the first crewed lunar mission since Apollo. Now comes the harder part.",
    "byline": "Wire Science Desk",
    "date": "September 5, 2026",
    "body": "When NASA's Orion capsule splashed down this spring, it closed out a ten-day, 694,481-mile journey around the Moon and back — the first time astronauts had traveled beyond low Earth orbit in more than fifty years. The four-person crew of Artemis II, NASA astronauts Reid Wiseman, Victor Glover and Christina Koch, along with Canadian Space Agency astronaut Jeremy Hansen, flew a free-return trajectory around the far side of the Moon before returning safely to Earth.\n\nThe flight was a test in every sense: of the Orion spacecraft's life-support systems with a crew aboard, of the Space Launch System rocket that carried them, and of NASA's ability to run a crewed deep-space mission for the first time since the Apollo program ended. It did not attempt a landing.\n\nThat comes next. NASA has pointed Artemis III, expected in 2027, at a lunar south pole landing using a commercial lander still in development, followed by Artemis IV in early 2028, when a crew is expected to transfer from Orion directly to a commercial lander for the agency's first crewed touchdown of the new program. Artemis V and subsequent missions, planned roughly annually from late 2028 onward, are meant to build toward a sustained human presence on the lunar surface — a proving ground, NASA says, for the systems that would eventually carry astronauts to Mars.\n\nFor now, Artemis II stands as proof of concept: complicated, expensive, and, after half a century, real.",
    "source": "Compiled from NASA mission updates and public affairs releases, 2026."

    "dek": "Danish director May El-Toukhy's drama won the festival's top prize, while John Malkovich claimed best actor and George Clooney received a Golden Lion for lifetime achievement.",
    "byline": "Wire Culture Desk",
    "date": "September 7, 2026",
    "body": "The 2026 Venice Film Festival closed with its top honor, the Golden Lion, going to \"Woman Unknown,\" a drama directed by May El-Toukhy, the jury announced at the festival's closing ceremony on the Lido.\n\nJohn Malkovich was named best actor for his performance in the festival's competition lineup, continuing a late-career run of acclaimed work. The full slate of prizes, spanning acting, directing and screenwriting honors, capped eleven days of premieres that drew the industry's attention back to the Adriatic after a summer dominated by streaming-platform releases.\n\nOutside the main competition, the festival's Golden Lion for Lifetime Achievement went to George Clooney, recognizing a screen career spanning three decades as an actor, director and producer. The honor is typically presented on the festival's opening days, ahead of the competition results.\n\nVenice remains one of the industry's three major European festivals alongside Cannes and Berlin, and its prizes — the Golden Lion chief among them — are closely watched as early signals of the coming awards season.",

  function renderArt(article, sizeClass){
    if(!article) return "";
    if(article.photo){
      if(sizeClass === "art-article"){
        return (
          '<div class="article-photo-wrap">' +
            '<img class="article-photo" src="' + article.photo + '" alt="' + esc(article.headline) + '">' +
            (article.caption ? '<div class="article-photo-cap">' + esc(article.caption) + '</div>' : "") +
          '</div>'
        );
      }
      return '<span class="art ' + sizeClass + ' art-photo"><img src="' + article.photo + '" alt=""></span>';
    }
    var icon = ART_ICONS[article.art];
    if(!icon) return "";
    return '<span class="art ' + sizeClass + '"><svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">' + icon + '</svg></span>';
  }

  function excerpt(body, n){
    var first = String(body || "").split(/\n\s*\n/)[0] || "";
    return first.length > n ? first.slice(0, n).replace(/\s+\S*$/, "") + "…" : first;
  }

  /* ---------- render: front page (also used as filtered category page) ---------- */
  function renderFront(){
    var list = ARTICLES;
    var heading = "";
    if(VIEW.view === "category"){
      list = ARTICLES.filter(function(a){ return a.category === VIEW.category; });
      heading = '<div class="eyebrow" style="padding:20px 0 0; color:var(--ink-soft);">Section</div><h2 style="font-family:\'Playfair Display\',serif;font-size:1.8rem;">' + esc(VIEW.category) + '</h2><hr class="rule rule-thin" style="margin-top:14px;">';
    }
    if(list.length === 0){
      return heading + '<div class="empty-note">No dispatches filed in this section yet. Be the first &mdash; <button class="continue" data-nav="submit" style="display:inline;">file a story &rarr;</button></div>';
    }

    var lead = list[0];
    var rail = list.slice(1, 4);
    var grid = list.slice(4);

    var html = heading;
    html += '<div class="front-grid">';
    html += (
      '<div class="lead">' +
        renderArt(lead, "art-lead") +
        '<div class="eyebrow lead-tag">' + esc(lead.category) + ' &middot; Lead Dispatch</div>' +
        '<button data-nav="article" data-id="' + esc(lead.id) + '" style="background:none;border:none;text-align:left;cursor:pointer;color:inherit;padding:0;display:block;width:100%;">' +
          '<h2>' + esc(lead.headline) + '</h2>' +
        '</button>' +
        '<div class="dek">' + esc(lead.dek) + '</div>' +
        '<div class="meta">By ' + esc(lead.byline) + ' &middot; ' + esc(lead.date) + '</div>' +
        '<p class="excerpt">' + esc(excerpt(lead.body, 340)) + '</p>' +
        '<button class="continue" data-nav="article" data-id="' + esc(lead.id) + '">Continue Reading &rarr;</button>' +
      '</div>'
    );
    html += '<div class="rail"><h3 class="rail-title">Editors’ Picks</h3>';
    rail.forEach(function(a, i){
      html += (
        '<div class="rail-item" data-nav="article" data-id="' + esc(a.id) + '">' +
          '<span class="rail-num">' + (i + 1) + '</span>' +
          renderArt(a, "art-rail") +
          '<div><div class="eyebrow" style="color:var(--ink-soft);">' + esc(a.category) + '</div>' +
          '<h4>' + esc(a.headline) + '</h4>' +
          '<div class="meta">' + esc(a.date) + '</div></div>' +
        '</div>'
      );
    });
    if(rail.length === 0){ html += '<div class="meta" style="padding-top:6px;">More dispatches will appear here.</div>'; }
    html += '</div>';
    html += '</div>';

    if(grid.length){
      html += '<div class="story-grid">';
      grid.forEach(function(a){
        html += (
          '<div class="story-card" data-nav="article" data-id="' + esc(a.id) + '">' +
            renderArt(a, "art-card") +
            '<div class="eyebrow" style="color:var(--ink-soft);">' + esc(a.category) + '</div>' +
            '<h4>' + esc(a.headline) + '</h4>' +
            '<div class="dek">' + esc(excerpt(a.body, 110)) + '</div>' +
            '<div class="meta">' + esc(a.date) + '</div>' +
          '</div>'
        );
      });
      html += '</div>';
    }
    return html;
  }

  /* ---------- render: single article ---------- */
  function renderArticle(){
    var a = ARTICLES.filter(function(x){ return x.id === VIEW.articleId; })[0];
    if(!a){ VIEW = { view:"front" }; return renderFront(); }
    var related = ARTICLES.filter(function(x){ return x.id !== a.id; }).slice(0, 3);
    var noticeHtml = VIEW.notice ? '<div class="notice-banner">' + esc(VIEW.notice) + '</div>' : "";

    var html = noticeHtml + '<div class="article-page">';
    html += '<button class="back-link" data-nav="front">&larr; Back to the Front Page</button>';
    html += '<div class="eyebrow" style="color:var(--accent);">' + esc(a.category) + '</div>';
    html += '<h1 class="headline">' + esc(a.headline) + '</h1>';
    html += '<div class="dek">' + esc(a.dek) + '</div>';
    html += renderArt(a, "art-article");
    html += '<div class="byline-row meta">By ' + esc(a.byline) + ' &middot; ' + esc(a.date) + '</div>';
    html += '<div class="article-body">' + paragraphs(a.body) + '</div>';
    if(a.source){ html += '<div class="source-note">' + esc(a.source) + '</div>'; }
    if(related.length){
      html += '<div class="related"><h3>More From the Wire</h3>';
      related.forEach(function(r){
        html += (
          '<div class="related-item" data-nav="article" data-id="' + esc(r.id) + '">' +
            '<div class="eyebrow" style="color:var(--ink-soft);">' + esc(r.category) + '</div>' +
            '<h4>' + esc(r.headline) + '</h4>' +
          '</div>'
        );
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- render: submit page ---------- */
  function renderSubmit(){
    var catOptions = CATEGORIES.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join("");
    var disabledNote = "";
    if(capReady && !artifactCap){
      disabledNote = '<div class="notice-banner">This copy of the Wire can\'t save new stories from here &mdash; you may be viewing a read-only link. Open your own copy of the page to file a dispatch.</div>';
    }
    return (
      '<div class="submit-page">' +
        '<div class="eyebrow" style="color:var(--ink-soft);">Press Room</div>' +
        '<h2>File a Dispatch</h2>' +
        '<div class="dek">Write it up and it runs as the new lead story on the Front Page.</div>' +
        disabledNote +
        '<form id="story-form">' +
          '<div class="field"><label for="f-headline">Headline</label>' +
            '<input id="f-headline" name="headline" type="text" maxlength="120" required placeholder="e.g. Local Bakery Wins National Award"></div>' +
          '<div class="field"><label for="f-dek">Deck (one-line summary)</label>' +
            '<input id="f-dek" name="dek" type="text" maxlength="200" placeholder="The sentence that runs under the headline"></div>' +
          '<div class="field"><label for="f-cat">Section</label>' +
            '<select id="f-cat" name="category">' + catOptions + '</select></div>' +
          '<div class="field"><label for="f-byline">Byline</label>' +
            '<input id="f-byline" name="byline" type="text" maxlength="60" placeholder="Staff Correspondent"></div>' +
          '<div class="field"><label for="f-body">Story</label>' +
            '<textarea id="f-body" name="body" required placeholder="Write the story here. Leave a blank line between paragraphs."></textarea>' +
            '<small>Separate paragraphs with a blank line &mdash; the first one gets the fancy drop cap.</small></div>' +
          '<button type="submit" class="file-btn"' + ((capReady && !artifactCap) ? " disabled" : "") + '>File This Story</button>' +
          '<div class="save-state" id="save-state"></div>' +
        '</form>' +
      '</div>'
    );
  }

  /* ---------- footer ---------- */
  function renderFooter(){
    return (
      '<hr class="rule rule-thick">' +
      '<div style="text-align:center;padding-top:14px;">The Wire Report is filed and maintained independently. Founded 2026. Every dispatch bears its own byline.</div>'
    );
  }

  function contentHTML(){
    if(VIEW.view === "article") return renderArticle();
    if(VIEW.view === "submit") return renderSubmit();
    return renderFront();
  }

  function paint(){
    document.getElementById("masthead-mount").innerHTML = renderMasthead();
    document.getElementById("content-mount").innerHTML = contentHTML();
    document.getElementById("footer-mount").innerHTML = renderFooter();
    window.scrollTo(0, 0);
    wireForm();
  }

  function wireForm(){
    var form = document.getElementById("story-form");
    if(!form) return;
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var headline = form.headline.value.trim();
      var body = form.body.value.trim();
      if(!headline || !body) return;
      var newArticle = {
        id: "story-" + Date.now(),
        category: form.category.value || "Dispatches",
        headline: headline,
        dek: form.dek.value.trim(),
        byline: form.byline.value.trim() || "Staff Correspondent",
        date: new Date().toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" }),
        body: body,
        source: "Filed directly to The Wire Report."
      };
      ARTICLES.unshift(newArticle);
      VIEW = { view:"article", articleId: newArticle.id, notice:"Filed to the Wire — now running as the lead story on the Front Page." };
      paint();
      saveToWire();
    });
  }

  /* ---------- click delegation ---------- */
  document.getElementById("app").addEventListener("click", function(ev){
    var el = ev.target.closest("[data-nav]");
    if(!el) return;
    var nav = el.getAttribute("data-nav");
    if(nav === "front") VIEW = { view:"front" };
    else if(nav === "category") VIEW = { view:"category", category: el.getAttribute("data-cat") };
    else if(nav === "article") VIEW = { view:"article", articleId: el.getAttribute("data-id") };
    else if(nav === "submit") VIEW = { view:"submit" };
    paint();
  });

  /* ---------- persistence via the artifact capability ---------- */
  function buildDocument(){
    var styleTag = document.getElementById("page-style").outerHTML;
    var scriptTag = document.getElementById("page-script").outerHTML;
    return (
      "<!doctype html>\n<html>\n<head>\n" +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      "<title>The Wire Report</title>\n" +
      styleTag + "\n</head>\n<body>\n" +
      '<div id="app"><header><div id="masthead-mount"></div></header>' +
      '<main id="content-mount"></main><footer id="footer-mount"></footer></div>\n' +
      '<script type="application/json" id="seed-data">' + JSON.stringify(ARTICLES) + "<" + "/script>\n" +
      scriptTag + "\n</body>\n</html>"
    );
  }

  function setSaveState(msg){
    var el = document.getElementById("save-state");
    if(el) el.textContent = msg;
  }

  function saveToWire(){
    if(!(window.claude && window.claude.use)){
      setSaveState("This story is showing on your screen, but this copy of the page can't save it permanently — edit the file directly to keep it for other visitors.");
      return;
    }
    (artifactCap ? Promise.resolve(artifactCap) : window.claude.use("artifact")).then(function(cap){
      artifactCap = cap;
      capReady = true;
      if(!cap){ setSaveState("Couldn't save — this looks like a read-only view."); return; }
      return cap.publish(buildDocument()).then(function(){
        setSaveState("Saved to your copy of the Wire.");
      });
    }).catch(function(){
      setSaveState("Couldn't save just now — your story is still showing on this screen.");
    });
  }

  /* ---------- boot ---------- */
  paint();
  if(window.claude && window.claude.use){
    window.claude.use("artifact").then(function(cap){
      artifactCap = cap; capReady = true;
      if(VIEW.view === "submit") paint();
    }).catch(function(){ capReady = true; });
  }
})();
</script>

</body>
</html>
